name: Check New IPO and Send Push Notification

on:
  schedule:
    # Runs every 3 hours every day (UTC). Nepal is UTC+5:45.
    # These times correspond to roughly 8:45, 11:45, 14:45, 17:45, 20:45, 23:45, 2:45, 5:45 Nepal time
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab at any time

jobs:
  check-ipo:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to commit updated seen_ipos.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works correctly
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install firebase-admin --quiet

      - name: Verify FIREBASE_KEY secret is set
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set in this repository!"
            echo "::error::Go to: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Name: FIREBASE_SERVICE_ACCOUNT, Value: (paste full content of your firebase service account JSON)"
            exit 1
          else
            echo "FIREBASE_KEY is set. Proceeding..."
          fi

      - name: Run Multi-Source IPO Checker
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/check_and_notify.py

      - name: Commit and push updated seen_ipos.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/seen_ipos.json
          if git diff --staged --quiet; then
            echo "No changes to seen_ipos.json — nothing to commit."
          else
            git commit -m "chore: update seen IPOs cache [skip ci]"
            git push
            echo "Successfully committed and pushed updated seen_ipos.json."
          fi
